<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <title>Gacha Checklist</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="theme-color" content="#08090a">
</head>
<body>
    <div class="app-shell">
        <aside class="app-sidebar">
            <div class="brand">
                <span class="brand-mark">&#10022;</span>
                <span class="brand-name">GACHA<br>CHECKLIST</span>
            </div>

            <nav class="quick-nav" id="quick-nav"></nav>
        </aside>

        <div class="app-main">
            <div class="sub-nav" id="sub-nav">
                <div class="sub-nav-inner">
                    <span><span class="t-d">Daily: </span><span id="daily-timer" class="timer-val">--:--:--</span></span>
                    <span><span class="t-w">Weekly: </span><span id="weekly-timer" class="timer-val">0d</span></span>
                    <span><span class="t-m">Monthly: </span><span id="monthly-timer" class="timer-val">0d</span></span>
                </div>
            </div>

            <div class="main-content" id="main-dashboard"></div>
            <div class="main-content d-none" id="banners-view"></div>
            <div class="main-content d-none" id="settings-view">
                <div class="settings-card">
                    <div class="settings-status">
                        <div class="footer-stat"><span class="footer-stat-label">Updated</span><span id="last-updated" class="text-light">-</span></div>
                        <div class="footer-stat"><span class="footer-stat-label">Reset</span><span id="last-reset" class="text-light">-</span></div>
                        <div id="sw-status" class="sw-status">Checking service worker&hellip;</div>
                        <div id="sync-status" class="sw-status">Sync off</div>
                    </div>
                    <div id="settings-body"></div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="#" class="bottom-nav-item" id="nav-checklist" onclick="setAppTab('checklist'); return false;">
                <span class="bottom-nav-icon">&#9745;</span>
                <span class="bottom-nav-label">Checklist</span>
            </a>
            <a href="#" class="bottom-nav-item" id="nav-banners" onclick="setAppTab('banners'); return false;">
                <span class="bottom-nav-icon">&#9670;</span>
                <span class="bottom-nav-label">Banners</span>
            </a>
            <a href="#" class="bottom-nav-item" id="nav-settings" onclick="setAppTab('settings'); return false;">
                <span class="bottom-nav-icon">&#9776;</span>
                <span class="bottom-nav-label">Settings</span>
            </a>
        </nav>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
